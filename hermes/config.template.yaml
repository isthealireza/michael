# TEMPLATE. Rendered to hermes/config.yaml by hermes/render_config.py,
# which substitutes ${...} from ../.env. The rendered file carries the
# database passwords and the embedding key, so it is git-ignored.
# Hermes Agent configuration for the Michael instance.
# Lives in the volume at /opt/data/config.yaml (chmod 600: it carries secrets).

model:
  # Chosen by benchmark, not by reputation: 42 runs over the acceptance
  # prompt and a deliberately uncovered question. The only two models that
  # never broke a rule were sonnet-5 and this one; this one is cheaper
  # ($0.017 vs $0.039 per run). See bench/ and the README.
  # NOTE: pin the provider to openrouter when overriding with -m; Hermes
  # routes some ids elsewhere (sonnet-5 resolves to 'gmi').
  default: deepseek/deepseek-v4-pro

_config_version: 39

# The background/auxiliary lane (context compression, vision, session-title
# generation, and similar side tasks) falls back to OpenRouter when the main
# provider is unavailable, and that fallback is not covered by the benchmark:
# Michael's cost is measured at $0.01171/run (see bench/) with no allowance
# for a paid model running unmeasured in the background. free_only pins the
# OpenRouter fallback step to :free SKUs so the auxiliary lane cannot spend
# outside that number.
auxiliary:
  free_only: true
  # free_only alone did not pin the fallback - it DISABLED it. The guard is a
  # filter, not a chooser: Hermes' default OpenRouter fallback model is a paid
  # SKU, so free_only rejected it and returned no client at all. Production
  # logged the refusal on every boot:
  #
  #   auxiliary.free_only is enabled but the OpenRouter fallback model
  #   'google/gemini-3.6-flash' is not a :free SKU - skipping the OpenRouter
  #   fallback.
  #
  # With step 2 skipped and Nous Portal unconfigured ("nous requested but Nous
  # Portal not configured"), every remaining step in the auxiliary chain was
  # also absent, so the lane had no fallback whatever: a hiccup on the main
  # provider failed the side task outright rather than degrading. Naming a
  # :free model restores step 2 and keeps the cost guarantee above exactly as
  # it was, because a :free SKU cannot spend.
  #
  # This one is Hermes' own documented example, and text-only is the right
  # shape here: the lane's other job is vision, and no image can reach Michael
  # - the gate allowlists prompt.submit with a `text` param and nothing else.
  # :free tiers are heavily rate limited, which is the correct trade for a
  # step that only runs when the main provider is already failing.
  openrouter_model: nvidia/nemotron-3-ultra-550b-a55b:free

  # NOUS PORTAL IS LEFT UNCONFIGURED ON PURPOSE. Do not "fix" the two WARNING
  # lines it writes on every boot by running `hermes auth` and adding credits.
  #
  #   Auxiliary Nous client unavailable: no Nous authentication found
  #   resolve_provider_client: nous requested but Nous Portal not configured
  #
  # Nous Portal is step 3 of the auxiliary chain and it is a PAID, metered
  # service - Hermes carries a whole payment/credit-exhaustion path for it and
  # checks _nous_portal_account_has_fresh_paid_access() before using it. The
  # free_only guard above does NOT cover it: read the auxiliary client and
  # every free_only test sits inside the OpenRouter path
  # (_aux_openrouter_settings -> _try_openrouter), nowhere else. Authenticating
  # Nous would therefore put a metered provider in the background lane with no
  # cost guard on it at all, which is exactly the unmeasured spend the comment
  # above exists to prevent, and would put the benchmarked $0.01171/run back in
  # question.
  #
  # With step 2 working there is nothing to gain either: Nous would be a third
  # option behind a main provider and a free fallback. The warnings are the
  # chain honestly reporting its own shape, not a defect.

mcp_servers:
  michael:
    # Container path: Hermes runs stdio MCP servers as subprocesses inside its
    # own container, so a host path would not resolve.
    command: /opt/michael/.venv/bin/python
    # No --allow-writes. The answering agent must not be able to write to the
    # corpus. A deployed agent used ingest_source_url mid-answer, pulled a
    # headings-only page into the corpus, and cited it in the same turn; the
    # read-only database role could not prevent it because ingestion runs
    # under the read/write URL by design. Ingestion is an operator action.
    args:
      - -m
      - michael.mcp_server
    connect_timeout: 60.0
    enabled: true
    # Hermes deliberately filters the environment of stdio subprocesses to a
    # small allowlist (PATH, HOME, USER, LANG). Michael's settings therefore
    # have to be declared here; inheriting them from the container does not work.
    env:
      PYTHONUNBUFFERED: "1"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY}"
      EMBEDDING_BASE_URL: "https://openrouter.ai/api/v1"
      EMBEDDING_DIM: "1536"
      EMBEDDING_MAX_CHARS: "16000"
      EMBEDDING_MODEL: "openai/text-embedding-3-small"
      MICHAEL_DATABASE_URL: "${MICHAEL_DATABASE_URL}"
      MICHAEL_DOMAINS_FILE: "/opt/michael/domains.yaml"
      MICHAEL_INGESTION_LOG: "/opt/michael/sources/ingestion.log.jsonl"
      MICHAEL_RO_DATABASE_URL: "${MICHAEL_RO_DATABASE_URL}"
      MICHAEL_SOURCES_DIR: "/opt/michael/sources"
      MICHAEL_SYSTEM_PROMPT: "/opt/michael/MICHAEL.md"
      MICHAEL_TEMPLATES_DIR: "/opt/michael/templates"
      RETRIEVAL_CANDIDATES: "200"
      RETRIEVAL_MIN_SCORE: "0.60"
      RETRIEVAL_TOP_K: "12"
    tools:
      # An allowlist, not a blocklist: a tool added to Michael later is off
      # for the agent until someone names it here.
      include:
        - classify_request
        - search_provisions
        - draft_document
        - validate_output
      exclude:
        # Named as well as omitted, so the intent survives an edit to include.
        - apply_schema
        - ingest_source_url
        - ingest_local_file
        - seed_corpus
      resources: false
      prompts: false

# The dashboard refuses any non-loopback bind without an auth provider, and
# --insecure has been a no-op since the June 2026 hardening. Inside a container
# the bind must be 0.0.0.0 for Docker's port proxy to reach it, so auth is
# mandatory. The published port is still 127.0.0.1 only.
dashboard:
  basic_auth:
    username: "${DASHBOARD_USERNAME}"
    password_hash: "${DASHBOARD_PASSWORD_HASH}"

# Everything that can write a file or execute code is off, for every surface.
# `hermes tools disable` writes this list, but it lives in the same file this
# template renders, so it must be declared here or a redeploy silently restores
# the full toolset - which is exactly what happened to the web chat once.
#
# skills, cronjob and delegation are included because each is an indirect route
# back to execution: installing a package, scheduling a job, or spawning a
# subagent with its own tools.
agent:
  # Michael's answering path normally needs classify -> retrieve -> draft ->
  # validate. Bound tool loops so a stalled provider or MCP turn cannot run
  # indefinitely and consume the Railway process.
  max_turns: 16
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - computer_use
    - skills
    - cronjob
    - delegation
    - browser
    - image_gen
    - tts
