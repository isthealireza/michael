[project]
name = "michael"
version = "0.1.0"
description = "Internal legal research and drafting assistant (single user, not published)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "psycopg[binary]>=3.3.4,<3.4",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
# Only needed to seed from the Open Australian Legal Corpus.
corpus = ["datasets>=4.0.0,<5"]
# Only needed to expose the tools over MCP to an agent runtime.
mcp = ["mcp>=1.2.0,<2"]
# Only needed to run michael-gate, the public front door.
gate = [
    "argon2-cffi>=23.1.0,<25",
    "starlette>=0.41.0,<0.48",
    "uvicorn>=0.32.0,<0.40",
    # Floor is 14.0, not 13.0: at 13.x, websockets.connect is the legacy
    # client and takes `extra_headers`, not `additional_headers` (the
    # keyword michael.gate.app's relay() actually uses). Under 13.x that
    # TypeError is swallowed by relay()'s `except Exception` and closes
    # every WebSocket with 4503 -- I7.
    "websockets>=14.0,<16",
]

[project.scripts]
michael = "michael.cli:main"

[dependency-groups]
dev = ["mypy", "pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "michael"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# Captured evidence, not maintained source. These are the harness scripts a QA
# run actually executed, kept beside the results they produced so a reader can
# see how a number was obtained. Linting or reformatting them would edit the
# record of what ran, which is the one property that makes them worth keeping.
extend-exclude = ["docs/qa", ".orca/reports"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["michael", "tests"]

[tool.ruff.format]
line-ending = "lf"
# The formatter does not own prose. Ruff reads Python fences inside Markdown,
# and a fence in a spec or plan is an illustration, not a module: it is
# routinely a fragment, and the formatter reformats a fragment as though it
# were a whole statement. On one plan document that rewrites
#     elements_file=_path("MICHAEL_ELEMENTS_FILE", "elements.yaml"),
# - a keyword argument, shown as one - into
#     elements_file = (_path("MICHAEL_ELEMENTS_FILE", "elements.yaml"),)
# which is a tuple assignment and no longer the thing the document says. The
# rest of what it wants to change is the same class of edit: rewrapping code
# that was wrapped by hand to make a point in the surrounding paragraph.
#
# The same hazard reaches test data: tests/fixtures/contracts holds contract
# documents as Markdown, and a fixture the formatter may rewrite is not a
# fixture.
#
# So `ruff format .` is now safe to run from the repository root. Scoped to
# the format section, and by file type rather than by directory, so it stays
# narrow: excluding "docs" under [tool.ruff] extend-exclude would take the
# lint rules off any real Python living there too. (`ruff check` reports "No
# Python files found" for a .md path at 0.16.7 - it does not read fences at
# all - so nothing is lost on the lint side today either way.)
exclude = ["**/*.md"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "datasets", "mcp.*", "argon2", "argon2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# bench/ is scripts, not a package under src/; tests/test_run_bench.py reaches
# it the same way bench/analyse.py reaches michael - by adding its directory
# to sys.path at import time, which mypy's static analysis does not see.
module = ["run_bench"]
ignore_missing_imports = true



[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not integration and not network"]
pythonpath = [".", "src"]
markers = [
    "integration: requires a running michael-postgres container",
    "network: reaches an allowlisted host; excluded from the default run",
]
