[project]
name = "michael"
version = "0.1.0"
description = "Internal legal research and drafting assistant (single user, not published)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "psycopg[binary]>=3.3.4,<3.4",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
# Only needed to seed from the Open Australian Legal Corpus.
corpus = ["datasets>=4.0.0,<5"]
# Only needed to expose the tools over MCP to an agent runtime.
mcp = ["mcp>=1.2.0,<2"]
# Only needed to run michael-gate, the public front door.
gate = [
    "argon2-cffi>=23.1.0,<25",
    "starlette>=0.41.0,<0.48",
    "uvicorn>=0.32.0,<0.40",
    "websockets>=13.0,<16",
]

[project.scripts]
michael = "michael.cli:main"

[dependency-groups]
dev = ["mypy", "pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "michael"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# Captured evidence, not maintained source. These are the harness scripts a QA
# run actually executed, kept beside the results they produced so a reader can
# see how a number was obtained. Linting or reformatting them would edit the
# record of what ran, which is the one property that makes them worth keeping.
extend-exclude = ["docs/qa", ".orca/reports"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["michael", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "datasets", "mcp.*", "argon2", "argon2.*"]
ignore_missing_imports = true



[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not integration and not network"]
pythonpath = [".", "src"]
markers = [
    "integration: requires a running michael-postgres container",
    "network: reaches an allowlisted host; excluded from the default run",
]
